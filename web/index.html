<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MermaidView — Diagram Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span class="logo">MermaidView</span>
      <div class="controls">
        <input id="search" type="text" placeholder="Filter diagrams ( / to focus)" spellcheck="false" />
        <select id="file-filter" title="Show diagrams for...">
          <option value="all" selected>All files</option>
          <option value="__active">Active editor</option>
        </select>
        <button id="btn-present" title="Presentation mode (P)">▶ Present</button>
        <button id="btn-import" title="Import diagram (Alt+I)">📥 Import</button>
        <button id="btn-fit" title="Fit all diagrams (F)">Fit</button>
        <button id="btn-reset" title="Reset zoom/pan (R)">Reset</button>
        <button id="btn-reset-layout" title="Return to grouped file layout">Layout</button>
        <span id="status">Connecting...</span>
      </div>
    </header>

    <div id="canvas-container">
      <div id="canvas">
        <!-- Diagram cards rendered here -->
      </div>
    </div>

    <!-- Import Panel (hidden until shown) -->
    <dialog id="import-panel" style="border: 1px solid #555; background: var(--bg-2); padding: 20px; width: 450px; display: none; position: fixed; z-index: 9999; left: 50%; top: 50%; transform: translate(-50%, -50%);">
      <h3>📥 Import Diagram</h3>
      <p style="color: #999; font-size: 12px; margin-bottom: 10px;">Temporary import - lost on page reload, or just use markdown files in your project.</p>
      <textarea id="import-mermaid" rows="8"></textarea>
      <label style="display: block; margin-top: 10px; color: #aaa; font-size: 12px;">Tip: Drop .md/.mmd files onto canvas, or edit markdown files in your project - they load automatically!</label>
      <div style="margin-top: 10px; display: flex; gap: 10px;">
        <button id="import-add" style="width: 150px;">Add Diagram</button>
        <span id="import-close" style="cursor: pointer; margin-left: auto; color: #999; font-size: 24px;">✕</span>
      </div>
    </dialog>
  </div>

  <script src="mermaid.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
