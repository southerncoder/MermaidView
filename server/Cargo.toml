[package]
name = "mermaid-view-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mermaid-view-server"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
tungstenite = "0.30"
notify = "7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"